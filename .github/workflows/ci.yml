name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    # A throwaway Postgres for this run only, the same version as local
    # (Step 30) and Heroku. Deleted when the job ends.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: talaan
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:devpassword@localhost:5432/talaan
      # CI's database is thrown away after the run, so the browser tests can
      # reset this same one.
      E2E_DATABASE_URL: postgresql://postgres:devpassword@localhost:5432/talaan

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Set up the database
        run: |
          npx prisma migrate deploy
          npx prisma db seed

      - name: Lint
        run: npm run lint

      - name: Check tokens
        run: npm run check:tokens

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Runs end-to-end tests and accessibility audit (axe on every screen).
      - name: Browser tests (end-to-end and accessibility)
        run: npx playwright test

      - name: Upload accessibility report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
