<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talaan prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lexend:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F7FB; --surface:#FFFFFF; --ink:#12213F; --muted:#5B6B84; --line:#DFE6F0; --line-2:#EDF1F7;
  --brand:#223060; --brand-2:#1C77A5; --hi:#F9E321;
  --primary:var(--brand); --on-primary:#FFFFFF; --link:var(--brand-2); --head:var(--brand);
  --tint:color-mix(in srgb,var(--brand-2) 9%,#fff);
  --soft:color-mix(in srgb,var(--brand) 7%,#fff);
  --ok:#157A45; --ok-bg:#E2F5EA; --ok-fill:#22A861;
  --late:#8A5A00; --late-bg:#FFF0C7; --late-fill:#F2B400;
  --bad:#B92A32; --bad-bg:#FDE6E7; --bad-fill:#E0464D;
  --idle:#52627C; --idle-bg:#E8EEF6; --idle-fill:#B9C5D8;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1526; --surface:#141F36; --ink:#E9EFFA; --muted:#9BABC6; --line:#243250; --line-2:#1B2843;
    --primary:color-mix(in srgb,var(--brand-2) 70%,#fff); --on-primary:#08111F; --link:color-mix(in srgb,var(--brand-2) 55%,#fff); --head:color-mix(in srgb,var(--brand-2) 55%,#fff);
    --tint:color-mix(in srgb,var(--brand-2) 16%,#141F36);
    --soft:color-mix(in srgb,var(--brand) 32%,#141F36);
    --ok:#5EDB98; --ok-bg:#12382A; --late:#FFD166; --late-bg:#3A2E10; --bad:#FF8B91; --bad-bg:#40191C; --idle:#A9B7CE; --idle-bg:#1E2B45;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1526; --surface:#141F36; --ink:#E9EFFA; --muted:#9BABC6; --line:#243250; --line-2:#1B2843;
  --primary:color-mix(in srgb,var(--brand-2) 70%,#fff); --on-primary:#08111F; --link:color-mix(in srgb,var(--brand-2) 55%,#fff); --head:color-mix(in srgb,var(--brand-2) 55%,#fff);
  --tint:color-mix(in srgb,var(--brand-2) 16%,#141F36);
  --soft:color-mix(in srgb,var(--brand) 32%,#141F36);
  --ok:#5EDB98; --ok-bg:#12382A; --late:#FFD166; --late-bg:#3A2E10; --bad:#FF8B91; --bad-bg:#40191C; --idle:#A9B7CE; --idle-bg:#1E2B45;
}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Lexend,"Atkinson Hyperlegible",system-ui,sans-serif;font-weight:600;letter-spacing:-.01em;margin:0}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:inherit}
a{color:var(--link)}
:focus-visible{outline:3px solid var(--link);outline-offset:2px}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* buttons, fields, pills */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:10px;padding:10px 16px;font-weight:700;line-height:1.1;background:var(--primary);color:var(--on-primary)}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.ghost:hover{background:var(--soft);filter:none}
.btn.soft{background:var(--surface);color:var(--link);border-color:color-mix(in srgb,var(--brand-2) 30%,transparent)}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.btn.sm{padding:7px 11px;font-size:.875rem}
.btn.full{width:100%}
.icon-btn{border:0;background:transparent;border-radius:10px;padding:8px;display:inline-grid;place-items:center;color:var(--ink)}
.icon-btn:hover{background:var(--soft)}
.field{display:grid;gap:6px}
.field label{font-weight:700;font-size:.875rem}
.input,.select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.input:focus,.select:focus{border-color:var(--link);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--link) 25%,transparent)}
.input[disabled],.select[disabled]{background:var(--soft);color:var(--muted)}
.err{color:var(--bad);font-size:.85rem}
.hint{color:var(--muted);font-size:.875rem}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:.8rem;font-weight:700;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{color:var(--ok);background:var(--ok-bg)}
.pill.late{color:var(--late);background:var(--late-bg)}
.pill.bad{color:var(--bad);background:var(--bad-bg)}
.pill.idle{color:var(--idle);background:var(--idle-bg)}
.pill.role{color:var(--link);background:var(--soft)}
.chip{display:inline-block;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.82rem;color:var(--muted)}

/* logo */
.logo{border-radius:50%;background:#fff;object-fit:contain;box-shadow:0 0 0 1px var(--line);flex:none}
.mono{display:grid;place-items:center;border-radius:50%;background:var(--brand);color:#fff;font-family:Lexend,sans-serif;font-weight:700;flex:none}

/* login */
.login{display:grid;grid-template-columns:1.05fr 1fr;min-height:100vh}
.login-art{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;padding:32px 36px 40px;position:relative;overflow:hidden;isolation:isolate}
.login-art::before{content:"";position:absolute;inset:0;z-index:-1;background-image:linear-gradient(color-mix(in srgb,var(--brand-2) 10%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--brand-2) 10%,transparent) 1px,transparent 1px);background-size:30px 30px;-webkit-mask-image:radial-gradient(ellipse 65% 55% at 50% 50%,transparent 30%,#000 100%);mask-image:radial-gradient(ellipse 65% 55% at 50% 50%,transparent 30%,#000 100%)}
.art-deco{position:absolute;inset:0;z-index:-1;pointer-events:none}
.art-deco .ico{position:absolute;fill:none;stroke:var(--brand-2);stroke-width:1;stroke-linecap:round;stroke-linejoin:round;opacity:.22}
.art-deco .wave{position:absolute;left:0;bottom:0;width:100%;height:170px}
.wave .w1{fill:color-mix(in srgb,var(--brand-2) 7%,var(--surface))}
.wave .w2{fill:color-mix(in srgb,var(--brand-2) 12%,var(--surface))}
.portal-title{font-size:clamp(2.4rem,4.6vw,3.8rem);line-height:1.05;color:var(--head);font-weight:700;letter-spacing:-.02em;margin:0}
.art-top{width:100%;display:flex;justify-content:space-between;align-items:center;gap:16px}
.art-logo{margin-left:auto}
.art-center{flex:1;display:grid;place-content:center;justify-items:center;gap:12px;padding:16px 0 96px}
.art-logo .logo,.art-logo .mono{box-shadow:0 0 0 1px var(--line),0 14px 36px color-mix(in srgb,var(--brand) 16%,transparent)}
.deped{height:56px;width:auto;display:block}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .deped{background:#fff;border-radius:10px;padding:6px 10px;height:68px}}
:root[data-theme="dark"] .deped{background:#fff;border-radius:10px;padding:6px 10px;height:68px}
.school-name{font-family:Lexend,sans-serif;font-weight:600;font-size:clamp(1.6rem,3vw,2.5rem);line-height:1.2;max-width:20ch;color:var(--ink);margin:0}
.login-form{display:flex;flex-direction:column;justify-content:center;align-items:center;padding:40px 24px;background:var(--surface)}
.lf-inner{width:100%;max-width:380px;display:grid;gap:22px}
.lf-inner h2{font-size:1.7rem}
.fs{display:grid;gap:14px}
.fs h3{font-size:.95rem}
.pw{position:relative}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--link);font-weight:700;padding:6px 8px;border-radius:8px}
.demo{border-top:1px solid var(--line);padding-top:18px;display:grid;gap:10px}
.demo-btns{display:flex;gap:8px;flex-wrap:wrap}
.poweredby{margin-top:28px;color:var(--muted);font-size:.85rem}

/* shell */
.shell{display:grid;grid-template-columns:256px 1fr;min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:20px}
.brand{display:flex;gap:12px;align-items:center;padding:6px 8px}
.brand b{font-family:Lexend,sans-serif;font-size:.95rem;line-height:1.25;display:block}
.brand span{color:var(--muted);font-size:.8rem}
.nav{display:grid;gap:4px}
.nav a{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;color:var(--muted);text-decoration:none;font-weight:700}
.nav a:hover{background:var(--soft);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--soft);color:var(--ink);box-shadow:inset 4px 0 0 var(--hi)}
.side-foot{margin-top:auto;color:var(--muted);font-size:.8rem;padding:0 8px}
.main{min-width:0}
.top{display:flex;align-items:center;gap:12px;padding:14px 28px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:5}
.top h1{font-size:1.2rem}
.top .sp,.sp{flex:1}
.top .date{color:var(--muted);font-size:.875rem}
.top .select{width:auto;max-width:240px;padding:7px 10px}
.menu-btn{display:none}
.theme-pick{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.875rem}
.theme-pick .select{width:auto;padding:7px 10px}
.swatch{width:16px;height:16px;border-radius:50%;background:linear-gradient(135deg,var(--brand) 50%,var(--brand-2) 50%);box-shadow:0 0 0 1px var(--line);flex:none}
.userbtn{display:flex;gap:10px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px 4px 4px}
.userbtn .av{width:32px;height:32px;font-size:.75rem}
.userbtn small{display:block;color:var(--muted);line-height:1.1}
.userbtn b{display:block;line-height:1.2;font-size:.875rem}
.pop{position:absolute;right:28px;top:62px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px;width:260px;box-shadow:0 12px 32px rgba(10,20,40,.18);z-index:8;display:none}
.pop.open{display:block}
.pop h3{font-size:.8rem;color:var(--muted);padding:6px 10px;font-weight:600}
.pop button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:9px 10px;border-radius:10px}
.pop button:hover{background:var(--soft)}
.content{padding:24px 28px 64px;max-width:1180px;margin:0 auto}
.pagehead{margin-bottom:18px;display:flex;gap:12px;justify-content:space-between;align-items:flex-end;flex-wrap:wrap}
.pagehead h2{font-size:1.5rem}
.pagehead p{color:var(--muted);margin-top:2px}

/* dashboard */
.hero{background:var(--tint);border:1px solid color-mix(in srgb,var(--brand-2) 18%,transparent);border-radius:22px;padding:22px 24px;display:grid;gap:18px}
.hero-top{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.hero-title{font-size:1rem;color:var(--muted);font-weight:500;margin-bottom:6px}
.big{font-family:Lexend,sans-serif;font-weight:700;font-size:clamp(2.2rem,5.5vw,3.4rem);line-height:1}
.big small{font-family:"Atkinson Hyperlegible",sans-serif;font-size:1rem;font-weight:400;color:var(--muted);margin-left:10px}
.hero-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:flex;height:24px;border-radius:999px;overflow:hidden;gap:2px;background:var(--surface)}
.seg i{display:block;height:100%;transition:width .5s ease}
.legend{display:flex;gap:26px;flex-wrap:wrap}
.legend div{display:flex;gap:10px;align-items:center}
.legend .dot{width:12px;height:12px;border-radius:50%}
.legend b{font-family:Lexend,sans-serif;font-size:1.25rem;display:block;line-height:1.1}
.legend small{color:var(--muted)}
.grid2{display:grid;grid-template-columns:1.2fr 1fr;gap:18px;margin-top:18px}
.stack{display:grid;gap:18px;align-content:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.card h2{font-size:1.05rem}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.gr{display:grid;grid-template-columns:76px 1fr 56px;align-items:center;gap:12px;padding:8px 0}
.gr .bar{height:12px;border-radius:99px;background:var(--line-2);overflow:hidden}
.gr .bar i{display:block;height:100%;border-radius:99px}
.gr .pct{text-align:right;font-family:Lexend,sans-serif;font-weight:600}
.gr small{color:var(--muted);display:block;line-height:1.1}
.alert{display:flex;gap:12px;padding:10px 12px;border-radius:12px;background:var(--bad-bg);margin-bottom:8px;align-items:flex-start;border-left:5px solid var(--bad-fill)}
.alert.warn{background:var(--late-bg);border-left-color:var(--late-fill)}
.alert b{display:block}
.alert small{color:var(--muted)}
.feed{list-style:none;margin:0;padding:0}
.feed li{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line-2)}
.feed li:first-child{border-top:0}
.feed li.fresh{animation:pop .9s ease}
@keyframes pop{from{background:color-mix(in srgb,var(--hi) 60%,transparent);transform:translateY(-6px)}to{background:transparent;transform:none}}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-family:Lexend,sans-serif;font-size:.8rem;background:var(--soft);color:var(--link);flex:none}
.feed .who{flex:1;min-width:0}
.feed .who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feed .who small{color:var(--muted)}
.feed time{color:var(--muted);font-size:.85rem;white-space:nowrap}
.empty{padding:36px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}

/* tables */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.toolbar .field{min-width:150px}
.search{position:relative;flex:1;min-width:210px;max-width:340px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search .input{padding-left:40px}
.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px}
table{width:100%;border-collapse:collapse;min-width:720px}
th{text-align:left;font-size:.82rem;color:var(--muted);font-weight:700;padding:12px 16px;border-bottom:1px solid var(--line)}
td{padding:11px 16px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--soft)}
.name{display:flex;gap:12px;align-items:center}
.name b{display:block}
.name small{color:var(--muted)}
.tfoot{color:var(--muted);font-size:.85rem;margin-top:10px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}

/* drawer + toast */
#drawer-scrim{position:fixed;inset:0;background:rgba(10,20,40,.42);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#drawer{position:fixed;top:0;right:0;height:100%;width:min(480px,100%);background:var(--surface);z-index:21;transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column;box-shadow:-8px 0 32px rgba(10,20,40,.2)}
body.drawer-open #drawer{transform:none}
body.drawer-open #drawer-scrim,body.nav-open #drawer-scrim{opacity:1;pointer-events:auto}
.d-head{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid var(--line)}
.d-head h2{font-size:1.2rem}
.d-body{padding:20px 22px;overflow:auto;flex:1;display:grid;gap:22px;align-content:start}
.d-foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cardbox{border:1px dashed color-mix(in srgb,var(--brand-2) 45%,transparent);border-radius:14px;padding:14px;display:grid;gap:10px;background:var(--soft)}
.uid{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.95rem;letter-spacing:.02em;word-break:break-all}
.pulse{width:40px;height:40px;border-radius:50%;background:var(--hi);animation:ring 1.5s ease-out infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--hi) 70%,transparent)}100%{box-shadow:0 0 0 22px transparent}}
.waiting{display:flex;gap:14px;align-items:center}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.swatches{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.swatches input[type=color]{width:100%;height:42px;padding:3px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.prev{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:14px}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:50;max-width:90vw;font-weight:700}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* tap station */
.kiosk{display:grid;gap:16px;max-width:760px}
.status-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.result{border-radius:26px;padding:36px 24px;text-align:center;min-height:340px;display:grid;place-content:center;justify-items:center;gap:10px;border:2px solid var(--line);background:var(--surface)}
.result.ok{background:var(--ok-bg);border-color:var(--ok-fill)}
.result.dup{background:var(--late-bg);border-color:var(--late-fill)}
.result.bad{background:var(--bad-bg);border-color:var(--bad-fill)}
.result .nm{font-family:Lexend,sans-serif;font-weight:700;font-size:clamp(1.6rem,4.5vw,2.4rem);line-height:1.15}
.result .lead{font-size:1.1rem;color:var(--muted)}
.glyph{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font-size:2.3rem;font-weight:700;color:#fff}
.ok .glyph{background:var(--ok-fill)}
.dup .glyph{background:var(--late-fill);color:#2b1d00}
.bad .glyph{background:var(--bad-fill)}
.photo{width:104px;height:104px;border-radius:22px;background:var(--surface);color:var(--link);display:grid;place-items:center;font-family:Lexend,sans-serif;font-size:2rem;font-weight:700;border:1px solid var(--line)}
.ring{width:96px;height:96px;border-radius:50%;border:6px solid var(--brand-2);animation:ring2 2s ease-out infinite}
@keyframes ring2{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--brand-2) 45%,transparent)}100%{box-shadow:0 0 0 30px transparent}}
.simbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:14px;border:1px dashed var(--line);border-radius:14px}
.simbar span{color:var(--muted);font-size:.875rem;margin-right:4px}

@media (prefers-reduced-motion: reduce){.pulse,.ring,.feed li.fresh{animation:none}.seg i,#drawer{transition:none}}
@media (max-width:900px){
  .login{grid-template-columns:1fr}
  .login-art{padding:24px 20px 40px}
  .art-center{flex:none;padding:36px 0 56px}
  .art-deco .ico{display:none}
  .portal-title{font-size:2.3rem}
  .school-name{font-size:1.5rem}
  .deped{height:44px}
  .art-logo .logo{width:72px;height:72px}
  .art-logo .mono{width:72px!important;height:72px!important;font-size:28px!important}
  .shell{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;z-index:30;width:270px;transform:translateX(-100%);transition:transform .25s}
  body.nav-open .side{transform:none;box-shadow:8px 0 32px rgba(10,20,40,.25)}
  .menu-btn{display:inline-grid}
  .top,.content{padding-left:16px;padding-right:16px}
  .top .date,.userbtn span.who,.theme-pick span{display:none}
  .userbtn{padding:4px}
  .pop{right:16px}
  .grid2{grid-template-columns:1fr}
  .row2{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="drawer-scrim" data-act="closeAll"></div>
<aside id="drawer" role="dialog" aria-modal="true" aria-label="Details" aria-hidden="true"></aside>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
const $=(s,el)=>(el||document).querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const rnd=a=>a[Math.floor(Math.random()*a.length)];
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng(20260921);
const pick=a=>a[Math.floor(R()*a.length)];
const ri=(a,b)=>a+Math.floor(R()*(b-a+1));
const NOW=new Date();
const todayISO=NOW.getFullYear()+'-'+pad(NOW.getMonth()+1)+'-'+pad(NOW.getDate());
function fmt(m){const h=Math.floor(m/60),mm=m%60;return (h%12||12)+':'+pad(mm)+' '+(h>=12?'PM':'AM')}
function ageOf(iso){if(!iso)return '';const b=new Date(iso+'T00:00:00');if(isNaN(b))return '';let a=NOW.getFullYear()-b.getFullYear();const m=NOW.getMonth()-b.getMonth();if(m<0||(m===0&&NOW.getDate()<b.getDate()))a--;return a}
function makeUID(){return Array.from({length:7},(_,i)=>i===0?'04':ri(0,255).toString(16).padStart(2,'0')).join(':').toUpperCase()}
function newUID(){let u;do{u=makeUID().split(':').map((x,i)=>i===0?x:pad(0)===x?x:x).join(':')}while(students.some(s=>s.card.uid===u));return u}

function allowed(v){return v==='login'||navFor().some(n=>n[0]===v)}

  const v=location.hash.replace(/^#\/?/,'')||'login';

  if(!allowed(v)){toast('Your role cannot open that page');location.hash='#/'+(state.role==='super'&&!state.school?'schools':'dashboard');return}

  const titles={schools:'Schools',dashboard:'Dashboard',attendance:'Attendance',students:'Students',staff:'Staff',station:'Tap station'};

}

function legend(c){
  const items=[['Present','ok-fill',c.present],['Late','late-fill',c.late],['Absent','bad-fill',c.absent],['Not yet tapped','idle-fill',c.notyet]];
  return '<div class="legend">'+items.map(i=>'<div><span class="dot" style="background:var(--'+i[1]+')"></span><div><b>'+i[2]+'</b><small>'+i[0]+'</small></div></div>').join('')+'</div>';
}
function seg(c,total){
  const w=n=>(n/total*100).toFixed(2)+'%';
  return '<div class="seg" role="img" aria-label="Present '+c.present+', late '+c.late+', absent '+c.absent+', not yet tapped '+c.notyet+'"><i style="width:'+w(c.present)+';background:var(--ok-fill)"></i><i style="width:'+w(c.late)+';background:var(--late-fill)"></i><i style="width:'+w(c.absent)+';background:var(--bad-fill)"></i><i style="width:'+w(c.notyet)+';background:var(--idle-fill)"></i></div>';
}
function feedHTML(list){
  if(!list.length)return '<div class="empty"><b>No taps yet</b>Taps appear here as students arrive.</div>';
  return '<ul class="feed">'+list.slice(0,7).map(t=>{const s=byId(t.sid);return '<li'+(t.fresh?' class="fresh"':'')+'><span class="av">'+initials(s)+'</span><div class="who"><b>'+esc(sname(s))+'</b><small>Grade '+s.grade+' \u2013 '+esc(s.section)+', '+esc(t.station)+'</small></div><time>'+fmt(t.m)+'</time></li>'}).join('')+'</ul>';
}

  const cls=students.filter(inClass);

  const roll=cls.map(s=>'<tr><td><div class="name"><span class="av">'+initials(s)+'</span><div><b>'+esc(sname(s))+'</b><small>'+(s.timeIn?'In at '+fmt(s.timeIn):'No tap yet')+'</small></div></div></td><td>'+statusPill(s.today)+'</td></tr>').join('');

  '<section class="card"><div class="card-head"><h2>Live taps in your class</h2></div>'+feedHTML(taps.filter(t=>inClass(byId(t.sid))))+'</section></div>';
}
function recordTap(s,station){
  s.timeIn=state.simMin;const prev=s.today;s.today=state.simMin<=450?'present':'late';
  if((prev==='notyet'||prev==='absent')&&state.role!=='teacher'){SCHOOL[prev]--;SCHOOL[s.today]++}
  else if(prev==='notyet'||prev==='absent'){SCHOOL[prev]--;SCHOOL[s.today]++}
  taps.forEach(t=>t.fresh=false);
  taps.unshift({sid:s.id,m:state.simMin,station:station,fresh:true});
  if(taps.length>30)taps.pop();
}
function simTap(){
  state.simMin+=1;
  const pool=students.filter(s=>s.card.status==='active'&&(state.role!=='teacher'||inClass(s)));
  const fresh=pool.filter(s=>s.today==='notyet'||s.today==='absent');
  const s=rnd(fresh.length?fresh:pool);
  recordTap(s,'Main gate');
  render();
  toast(sname(s)+' tapped in at '+fmt(state.simMin));
}

  '<div class="fs"><h3>Parent or guardian</h3>'+field('Name','f_gname',d.gname)+field('Mobile number for alerts','f_gmob',d.gmob,'tel','','inputmode="tel"')+'</div>'+
  '<div class="fs"><h3>ID card</h3>'+cardBox(d)+'</div></div>'+
  '<div class="d-foot"><button class="btn ghost" data-act="closeAll">Cancel</button><button class="btn" data-act="saveStudent">Save student</button></div>';
}
function cardBox(d){
  const c=d.card,m=drawer.mode;
  if(m==='waiting')return '<div class="cardbox"><div class="waiting"><span class="pulse"></span><div><b>Hold the card against the reader</b><div class="hint">Waiting for a tap\u2026</div></div></div><div class="btnrow"><button class="btn soft sm" data-act="simCard">Simulate a card tap</button><button class="btn ghost sm" data-act="cancelLink">Cancel</button></div></div>';
  if(m==='confirm')return '<div class="cardbox"><b>Mark this card as lost?</b><div class="hint">It will stop working at every tap station. You will then tap a new card to link it.</div><div class="btnrow"><button class="btn danger sm" data-act="confirmReplace">Yes, replace card</button><button class="btn ghost sm" data-act="cancelLink">Keep card</button></div></div>';
  let hist=d.history.length?'<div class="hint">Previous cards: '+d.history.map(h=>'<span class="uid">'+esc(h)+'</span> (lost)').join(', ')+'</div>':'';
  if(c.status==='active')return '<div class="cardbox"><div>'+cardPill(c)+'</div><div class="uid">'+esc(c.uid)+'</div>'+hist+'<div class="btnrow"><button class="btn ghost sm" data-act="askReplace">Card lost? Replace it</button></div></div>';
  if(c.status==='lost')return '<div class="cardbox"><div>'+cardPill(c)+'</div><div class="uid">'+esc(c.uid)+'</div>'+hist+'<div class="btnrow"><button class="btn sm" data-act="startLink">Link a new card</button></div></div>';
  return '<div class="cardbox"><div>'+cardPill(c)+'</div><div class="hint">No card is linked to this student yet.</div>'+hist+'<div class="btnrow"><button class="btn sm" data-act="startLink">Link card</button></div></div>';
}
function captureStudent(){
  if(drawer.type!=='student')return;
  const map={f_first:'first',f_mid:'mid',f_last:'last',f_birth:'birth',f_lrn:'lrn',f_grade:'grade',f_sec:'section',f_gname:'gname',f_gmob:'gmob'};
  Object.keys(map).forEach(k=>{const el=$('#'+k);if(el)drawer.draft[map[k]]=el.value});
  drawer.draft.grade=Number(drawer.draft.grade);
}
function openStudent(id){
  const s=id?byId(+id):null;
  drawer.type='student';drawer.id=s?s.id:null;drawer.mode='idle';drawer.errs={};
  drawer.draft=s?JSON.parse(JSON.stringify(s)):{first:'',mid:'',last:'',birth:'',lrn:'',grade:7,section:'Curie',gname:'',gmob:'',card:{uid:null,status:null},today:'notyet',timeIn:null,history:[]};
  paintDrawer();openDrawer();
}
function saveStudent(){
  captureStudent();const d=drawer.draft,e={};
  if(!d.first.trim())e.first='Enter the first name';
  if(!d.last.trim())e.last='Enter the surname';
  if(!d.birth)e.birth='Enter the birth date';else if(new Date(d.birth+'T00:00:00')>NOW)e.birth='Birth date cannot be in the future';
  if(d.lrn&&!/^\d{12}$/.test(d.lrn))e.lrn='An LRN has 12 digits';
  drawer.errs=e;
  if(Object.keys(e).length){paintDrawer();return}
  if(drawer.id){Object.assign(byId(drawer.id),d);toast('Saved changes to '+sname(d))}
  else{d.id=Math.max.apply(null,students.map(s=>s.id))+1;students.unshift(d);SCHOOL.total++;SCHOOL.notyet++;toast(sname(d)+' was added')}
  closeAll();render();
}

/* ---------- attendance ---------- */
function pageAttendance(){
  const t=state.role==='teacher',a=state.att;
  if(t){a.grade=10;a.section='Galileo'}
  if(!(SECTIONS[a.grade]||[]).includes(a.section))a.section=SECTIONS[a.grade][0];
  const list=students.filter(s=>s.grade===+a.grade&&s.section===a.section);
  const c={present:0,late:0,absent:0,notyet:0};list.forEach(s=>c[s.today]++);
  const isToday=a.date===todayISO;
  const rows=list.map(s=>'<tr><td><div class="name"><span class="av">'+initials(s)+'</span><div><b>'+esc(sname(s))+'</b><small>LRN '+esc(s.lrn)+'</small></div></div></td><td>'+(s.timeIn?fmt(s.timeIn):'\u2014')+'</td><td>'+(s.timeIn?'Still in school':'\u2014')+'</td><td>'+statusPill(s.today)+'</td><td>'+cardPill(s.card)+'</td></tr>').join('');
  return '<div class="pagehead"><div><h2>Attendance</h2><p>Pick a date and class to see who tapped in.</p></div><button class="btn ghost" data-act="exportCsv">Export to CSV</button></div>'+
  '<div class="toolbar">'+field('Date','a_date',a.date,'date','','data-in="attDate"')+sel('Grade','a_grade',[7,8,9,10,11,12].map(g=>[g,'Grade '+g]),a.grade,'data-in="attGrade"'+(t?' disabled':''))+sel('Section','a_sec',SECTIONS[a.grade],a.section,'data-in="attSec"'+(t?' disabled':''))+'</div>'+
  (isToday?'<div class="chips"><span class="pill ok">Present '+c.present+'</span><span class="pill late">Late '+c.late+'</span><span class="pill bad">Absent '+c.absent+'</span><span class="pill idle">Not yet tapped '+c.notyet+'</span></div><div class="table-wrap"><table><thead><tr><th>Student</th><th>Time in</th><th>Time out</th><th>Status</th><th>Card</th></tr></thead><tbody>'+rows+'</tbody></table></div>':
  '<div class="card"><div class="empty"><b>No records for that date in this prototype</b>Pick today\u2019s date to see the sample attendance.</div></div>');
}

/* ---------- staff ---------- */
function pageStaff(){
  const rows=staff.map(p=>'<tr><td><div class="name"><span class="av">'+esc(p.name.split(' ').map(w=>w[0]).slice(0,2).join(''))+'</span><div><b>'+esc(p.name)+'</b><small>'+esc(p.email)+'</small></div></div></td><td><span class="pill role">'+esc(p.role)+'</span></td><td>'+(p.advisory?esc(p.advisory):'\u2014')+'</td><td>'+(p.status==='Active'?'<span class="pill ok">Active</span>':'<span class="pill late">Invited</span>')+'</td></tr>').join('');
  return '<div class="pagehead"><div><h2>Staff</h2><p>Principals and teachers who can sign in to this school. They cannot see any other school.</p></div><button class="btn" data-act="addStaff">'+svg('plus')+'Add staff</button></div>'+
  '<div class="table-wrap"><table><thead><tr><th>Name</th><th>Role</th><th>Advisory class</th><th>Status</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}
function staffDrawer(){
  const d=drawer.draft,e=drawer.errs;
  return '<div class="d-head"><h2>Add staff</h2><button class="icon-btn" data-act="closeAll" aria-label="Close">'+svg('x')+'</button></div><div class="d-body"><div class="fs">'+
  field('Full name','s_name',d.name,'text',e.name)+field('Email','s_email',d.email,'email',e.email)+sel('Role','s_role',['Teacher','Principal'],d.role)+sel('Advisory class','s_adv',[['','None']].concat(ALLSEC),d.advisory)+
  '<p class="hint">They get an email to set their own password. Their account is tied to this school only.</p></div></div><div class="d-foot"><button class="btn ghost" data-act="closeAll">Cancel</button><button class="btn" data-act="saveStaff">Send invite</button></div>';
}
function saveStaff(){
  const d={name:$('#s_name').value.trim(),email:$('#s_email').value.trim(),role:$('#s_role').value,advisory:$('#s_adv').value},e={};
  if(!d.name)e.name='Enter the full name';
  if(!/^\S+@\S+\.\S+$/.test(d.email))e.email='Enter a valid email address';
  drawer.draft=d;drawer.errs=e;
  if(Object.keys(e).length){paintDrawer();return}
  staff.push({id:staff.length+1,name:d.name,email:d.email,role:d.role,advisory:d.advisory,status:'Invited'});
  closeAll();render();toast('Invite sent to '+d.email+' (demo)');
}

/* ---------- schools (super admin) ---------- */
function pageSchools(){
  const rows=Object.keys(SCHOOLS).map(k=>{const s=SCHOOLS[k];return '<tr><td><div class="name">'+logo(s,40)+'<div><b>'+esc(s.name)+'</b><small>'+esc(k)+'.talaan.example</small></div></div></td><td>'+s.students.toLocaleString()+'</td><td>'+s.staff+'</td><td>'+s.stations+'</td><td><span class="pill '+(s.status==='Live'?'ok':s.status==='Pilot'?'late':'idle')+'">'+esc(s.status)+'</span></td><td><button class="btn soft sm" data-act="openSchool" data-key="'+k+'">Open</button></td></tr>'}).join('');
  return '<div class="pagehead"><div><h2>Schools</h2><p>Each school has its own logo, colors and accounts. Open one to see it the way its principal does.</p></div><button class="btn" data-act="addSchool">'+svg('plus')+'Add school</button></div>'+
  '<div class="table-wrap"><table><thead><tr><th>School</th><th>Students</th><th>Staff</th><th>Tap stations</th><th>Status</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}
function schoolDrawer(){
  const d=drawer.draft,e=drawer.errs;
  return '<div class="d-head"><h2>Add school</h2><button class="icon-btn" data-act="closeAll" aria-label="Close">'+svg('x')+'</button></div><div class="d-body"><div class="fs">'+
  field('School name','c_name',d.name,'text',e.name,'data-in="schoolPrev"')+field('Short name','c_short',d.short,'text','','data-in="schoolPrev"')+field('Principal\u2019s email','c_email',d.email,'email',e.email)+
  '<div class="swatches"><div class="field"><label for="c_brand">Main color</label><input id="c_brand" type="color" value="'+d.brand+'" data-in="schoolPrev"></div><div class="field"><label for="c_brand2">Accent color</label><input id="c_brand2" type="color" value="'+d.brand2+'" data-in="schoolPrev"></div></div>'+
  '<div class="field"><label for="c_logo">Logo</label><input class="input" id="c_logo" type="file" accept="image/*" data-in="schoolLogo"></div>'+
  '<div><div class="hint" style="margin-bottom:6px">Preview of the sidebar header</div><div class="prev" id="schPrev"></div></div></div></div><div class="d-foot"><button class="btn ghost" data-act="closeAll">Cancel</button><button class="btn" data-act="saveSchool">Create school</button></div>';
}
function schoolPreview(){
  const d=drawer.draft;const el=$('#schPrev');if(!el)return;
  d.name=$('#c_name').value;d.short=$('#c_short').value;d.brand=$('#c_brand').value;d.brand2=$('#c_brand2').value;
  const fake={name:d.name||'New school',short:d.short||d.name||'New school',brand:d.brand,logo:d.logo};
  el.style.borderColor=d.brand2;
  el.innerHTML=logo(fake,44)+'<div><b style="font-family:Lexend,sans-serif">'+esc(d.name||'New school')+'</b><div class="hint" style="color:'+d.brand2+'">Attendance portal</div></div>';
}
function saveSchool(){
  schoolPreview();const d=drawer.draft,e={};d.email=$('#c_email').value.trim();
  if(!d.name.trim())e.name='Enter the school name';
  if(!/^\S+@\S+\.\S+$/.test(d.email))e.email='Enter the principal\u2019s email';
  drawer.errs=e;
  if(Object.keys(e).length){paintDrawer();schoolPreview();return}
  const key=(d.short||d.name).toLowerCase().replace(/[^a-z0-9]+/g,'').slice(0,12)||('school'+Date.now());
  SCHOOLS[key]={key:key,name:d.name.trim(),short:(d.short||d.name).trim(),brand:d.brand,brand2:d.brand2,hi:'#F9E321',logo:d.logo||null,students:0,staff:1,stations:0,status:'Setting up'};
  closeAll();render();toast(d.name.trim()+' created. Invite sent to '+d.email+' (demo)');
}

/* ---------- tap station ---------- */
function readyHTML(){return '<div class="ring"></div><div class="nm">Ready</div><p class="lead">Tap your ID card on the reader</p>'}
function pageStation(){
  return '<div class="pagehead"><div><h2>Tap station</h2><p>This is what a tablet or phone at the gate shows. The photo lets the guard see who is tapping.</p></div></div>'+
  '<div class="kiosk"><div class="status-row"><span class="pill '+(state.offline?'late':'ok')+'" id="netPill">'+(state.offline?'Offline':'Online')+'</span><span class="chip" id="queueChip">'+state.pending.length+' taps waiting to sync</span><span class="chip">Main gate</span><span class="sp"></span><button class="btn ghost sm" data-act="toggleOffline" id="offBtn">'+(state.offline?'Go back online':'Simulate offline')+'</button></div>'+
  '<div class="result" id="result">'+readyHTML()+'</div>'+
  '<div class="simbar"><span>Prototype controls</span><button class="btn soft sm" data-act="stTap" data-kind="valid">Valid card</button><button class="btn soft sm" data-act="stTap" data-kind="dup">Tapped twice</button><button class="btn soft sm" data-act="stTap" data-kind="lost">Lost card</button><button class="btn soft sm" data-act="stTap" data-kind="unknown">Unknown card</button></div></div>';
}
function stTap(kind){
  clearTimeout(state.tapTimer);state.simMin+=1;
  const box=$('#result');if(!box)return;
  let cls,glyph,name,lead,extra='';
  if(kind==='valid'){
    const pool=students.filter(s=>s.card.status==='active'),fresh=pool.filter(s=>s.today==='notyet'||s.today==='absent'),s=rnd(fresh.length?fresh:pool);
    cls='ok';glyph='\u2713';name=sname(s);lead='Grade '+s.grade+' \u2013 '+s.section;
    extra='<div class="photo" aria-hidden="true">'+initials(s)+'</div>';
    if(state.offline){state.pending.push(s.id);lead+=' \u2013 saved on this device, will sync later'}
    else{recordTap(s,'Main gate');lead+=' \u2013 time in '+fmt(state.simMin)}
  }else if(kind==='dup'){
    const s=rnd(students.filter(x=>x.timeIn&&x.card.status==='active'));
    cls='dup';glyph='!';name=sname(s);lead='Already tapped at '+fmt(s.timeIn)+'. This tap was ignored.';extra='<div class="photo" aria-hidden="true">'+initials(s)+'</div>';
  }else if(kind==='lost'){
    cls='bad';glyph='\u2715';name='Lost card';lead='This card was reported lost. Please see the guard.';
    alerts.unshift({tone:'bad',title:'Lost card tapped',detail:'A card reported lost was used at Main gate, '+fmt(state.simMin)});
  }else{
    cls='bad';glyph='\u2715';name='Card not registered';lead='Ask the office to link this card to a student.';
    alerts.unshift({tone:'warn',title:'Unknown card',detail:'A card that is not registered was tapped at Main gate, '+fmt(state.simMin)});
  }
  box.className='result '+cls;
  box.innerHTML=extra+'<div class="glyph" aria-hidden="true">'+glyph+'</div><div class="nm">'+esc(name)+'</div><p class="lead">'+esc(lead)+'</p>';
  $('#queueChip').textContent=state.pending.length+' taps waiting to sync';
  state.tapTimer=setTimeout(()=>{const b=$('#result');if(b){b.className='result';b.innerHTML=readyHTML()}},5000);
}
function toggleOffline(){
  state.offline=!state.offline;
  if(!state.offline&&state.pending.length){const n=state.pending.length;state.pending.forEach(id=>{state.simMin+=0;recordTap(byId(id),'Main gate')});state.pending=[];toast('Back online. '+n+' saved taps were uploaded.')}
  else toast(state.offline?'Offline. Taps are saved on the device.':'Back online.');
  render();
}

/* ---------- drawer plumbing ---------- */
function paintDrawer(){$('#drawer').innerHTML=drawer.type==='student'?studentDrawer():drawer.type==='staff'?staffDrawer():schoolDrawer()}
function openDrawer(){document.body.classList.add('drawer-open');$('#drawer').setAttribute('aria-hidden','false');if(drawer.type==='school')schoolPreview();const f=$('#drawer input,#drawer select');if(f)setTimeout(()=>f.focus(),60)}
function closeAll(silent){document.body.classList.remove('drawer-open','nav-open');const d=$('#drawer');if(d)d.setAttribute('aria-hidden','true');drawer.type=null;const p=$('#userpop');if(p)p.classList.remove('open')}

/* ---------- events ---------- */
const actions={
  signin(t){state.theme='school';state.role=t.dataset.role||'principal';state.school=state.role==='super'?null:'balsci';location.hash='#/'+(state.role==='super'?'schools':'dashboard');if(location.hash==='#/'+(state.role==='super'?'schools':'dashboard'))render()},
  forgot(e){toast('Password reset is not part of this prototype')},
  togglePw(t){const i=$('#l_pw');i.type=i.type==='password'?'text':'password';t.textContent=i.type==='password'?'Show':'Hide'},
  signout(){location.hash='#/login'},
  setRole(t){state.theme='school';state.role=t.dataset.role;state.school=state.role==='super'?null:'balsci';const home=state.role==='super'?'schools':'dashboard';if(location.hash==='#/'+home)render();else location.hash='#/'+home;},
  toggleNav(){document.body.classList.toggle('nav-open')},
  toggleUser(){$('#userpop').classList.toggle('open')},
  closeAll(){closeAll()},
  simTap(){simTap()},
  addStudent(){openStudent(null)},
  openStudent(t){openStudent(t.dataset.id)},
  saveStudent(){saveStudent()},
  startLink(){captureStudent();drawer.mode='waiting';paintDrawer()},
  cancelLink(){captureStudent();drawer.mode='idle';paintDrawer()},
  askReplace(){captureStudent();drawer.mode='confirm';paintDrawer()},
  confirmReplace(){captureStudent();const d=drawer.draft;if(d.card.uid)d.history.push(d.card.uid);d.card={uid:null,status:null};drawer.mode='waiting';paintDrawer()},
  simCard(){captureStudent();const u=newUID();drawer.draft.card={uid:u,status:'active'};drawer.mode='idle';paintDrawer();toast('Card '+u+' linked')},
  addStaff(){drawer.type='staff';drawer.errs={};drawer.draft={name:'',email:'',role:'Teacher',advisory:''};paintDrawer();openDrawer()},
  saveStaff(){saveStaff()},
  openSchool(t){state.theme='school';state.school=t.dataset.key;location.hash='#/dashboard';render();toast('Now viewing '+cur().short+'. Notice the logo and colors.')},
  addSchool(){drawer.type='school';drawer.errs={};drawer.draft={name:'',short:'',email:'',brand:'#0F5C4D',brand2:'#1B8F6A',logo:null};paintDrawer();openDrawer()},
  saveSchool(){saveSchool()},
  exportCsv(){toast('CSV export is a demo button in this prototype')},
  stTap(t){stTap(t.dataset.kind)},
  toggleOffline(){toggleOffline()}
};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  if(!t){const p=$('#userpop');if(p&&p.classList.contains('open')&&!e.target.closest('.userbtn'))p.classList.remove('open');return}
  if(t.tagName==='A'&&t.dataset.act==='forgot')e.preventDefault();
  const fn=actions[t.dataset.act];if(fn)fn(t,e);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&(document.body.classList.contains('drawer-open')||document.body.classList.contains('nav-open')))closeAll();
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('tr.click')){e.preventDefault();openStudent(e.target.dataset.id)}
});
const ins={
  q(t){state.filters.q=t.value;$('#stBody').innerHTML=studentRows();$('#stCount').textContent='Showing '+studentRows.count+' of '+(state.role==='teacher'?students.filter(inClass).length:SCHOOL.total)+' students. This is sample data; the real list loads page by page.'},
  fGrade(t){state.filters.grade=t.value;ins.q($('#q'))},
  fCard(t){state.filters.card=t.value;ins.q($('#q'))},
  birth(t){const el=$('#ageOut');if(el)el.textContent=t.value?'Age '+ageOf(t.value):'Age is worked out from the birth date'},
  grade(t){captureStudent();drawer.draft.section=SECTIONS[drawer.draft.grade][0];paintDrawer()},
  attDate(t){state.att.date=t.value||todayISO;render()},
  attGrade(t){state.att.grade=+t.value;state.att.section=SECTIONS[+t.value][0];render()},
  attSec(t){state.att.section=t.value;render()},
  switchSchool(t){state.theme='school';state.school=t.value||null;location.hash='#/'+(state.school?'dashboard':'schools');if(location.hash==='#/'+(state.school?'dashboard':'schools'))render()},
  theme(t){state.theme=t.value;applyTheme(activeTheme());const p=PRESETS.find(x=>x.id===t.value);toast('Theme changed to '+(p?p.name:'School colors'))},
  schoolPrev(){schoolPreview()},
  schoolLogo(t){const f=t.files&&t.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{drawer.draft.logo=r.result;schoolPreview()};r.readAsDataURL(f)}
};
function onIn(e){const t=e.target,k=t.dataset&&t.dataset.in;if(k&&ins[k])ins[k](t)}
document.addEventListener('input',onIn);
document.addEventListener('change',onIn);

render();
})();
</script>
</body>
</html>
